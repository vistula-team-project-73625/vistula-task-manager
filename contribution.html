
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Team Contribution</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            text-align: center;
            padding: 50px 20px;
        }

        .container {
            max-width: 500px;
            margin: 40px auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.1);
        }

        h1 {
            color: #2563eb;
        }

        button {
            background: #2563eb;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #1d4ed8;
        }

        #contributor-student-id {
            margin-top: 20px;
            font-weight: bold;
            font-size: 20px;
        }

        a {
            display: inline-block;
            margin-top: 25px;
            color: #2563eb;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Team Contribution</h1>

    <p>Contributor information</p>

    <button id="load-contributor">
        Show Contributor
    </button>

    <p id="contributor-student-id"></p>

    <a href="index.html">Back to Task Manager</a>

</div>

<script>
    const button = document.getElementById("load-contributor");

    button.addEventListener("click", async function() {

        const output = document.getElementById(
            "contributor-student-id"
        );

        try {
            const response = await fetch("./contribution.json");

            if (!response.ok) {
                throw new Error("Could not load contributor information.");
            }

            const data = await response.json();

            output.textContent =
                "Contributor Student ID: " + data.contributorStudentId;

        } catch (error) {
            output.textContent = "Error: " + error.message;
        }

    });
</script>

</body>
</html>
